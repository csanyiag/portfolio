    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const detailsElements = document.querySelectorAll("details[name='3d-subprojects']");

            detailsElements.forEach((details) => {
                details.addEventListener("toggle", (event) => {
                    if (details.open) {
                        detailsElements.forEach((other) => {
                            if (other !== details) {
                                other.open = false;
                            }
                        });

                        setTimeout(() => {
                            const stickyHeaderOffset = 80; 
                            const elementPosition = details.getBoundingClientRect().top;
                            const offsetPosition = elementPosition + window.pageYOffset - stickyHeaderOffset;

                            window.scrollTo({
                                top: offsetPosition,
                                behavior: "smooth"
                            });
                        }, 100);
                    }
                });
            });
        });
    </script>
